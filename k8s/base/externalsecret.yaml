apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mero-env
  namespace: mero
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mero-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        # Vault key holding the env for this app. Expected keys:
        #   DATABASE_URL, SECRET_KEY, CORS_ORIGINS, LOG_LEVEL
        key: apps/mero/mero/env
